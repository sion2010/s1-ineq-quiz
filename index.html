<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>簡易不等式教學建議</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--ink:#1c2430;--muted:#5b6675;--line:#d7deea;--paper:#f6f3eb;--card:#fffdf8;--teal:#0f6d6a;--teal-d:#0b524f;--gold:#c9a227;--rose:#b42318;--ok:#1b7a3d}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--teal);color:#fff}.btn-ghost{background:#eef3f2}.btn-gold{background:var(--gold)}.btn-rose{background:#f8e8e6;color:var(--rose)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.hint{color:var(--muted);font-size:13px}
</style></head><body>
<div class="wrap">
<div class="card">
<h1>簡易不等式教學建議</h1>
<p>如果你看到這段文字，代表 GitHub Pages 已經開成功，但程式檔仲未完全上載。</p>
<p>請到倉庫 <a href="https://github.com/sion2010/s1-ineq-quiz">sion2010/s1-ineq-quiz</a> 上傳這三個檔：</p>
<ul>
<li>index.html</li>
<li>quiz_data.js</li>
<li>quiz_app.js</li>
</ul>
<p>然後打開：<a href="https://github.com/sion2010/s1-ineq-quiz/settings/pages">Settings → Pages</a></p>
<p>Source 選 Deploy from a branch，Branch 選 main，資料夾選 / (root)，Save。</p>
</div>
</div>
<script src="quiz_data.js"></script>
<script src="quiz_questions.js"></script>
<script src="quiz_app.js"></script>
</body></html>
