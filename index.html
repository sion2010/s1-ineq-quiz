<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>簡易不等式教學建議 · 評估卷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--ink:#1c2430;--muted:#5b6675;--line:#d7deea;--paper:#f6f3eb;--card:#fffdf8;--teal:#0f6d6a;--teal-d:#0b524f;--gold:#c9a227;--rose:#b42318;--ok:#1b7a3d;--shadow:0 10px 30px rgba(28,36,48,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif}
button,input,textarea,select{font-family:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.app{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,var(--teal),#163a4a);color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.hidden{display:none!important}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--teal);color:#fff}.btn-ghost{background:#eef3f2;color:var(--ink)}
.btn-gold{background:var(--gold);color:#1c1608}.btn-rose{background:#f8e8e6;color:var(--rose)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-block;background:#e8f1f0;color:var(--teal-d);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.progress{height:8px;background:#e6ebea;border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3aa39a);width:0}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.marks{color:var(--muted);font-size:13px;white-space:nowrap}
.stem{font-size:20px;line-height:1.55;margin:8px 0 14px}
.modes{display:flex;gap:6px;margin-bottom:10px}.modes button{flex:1}.modes button.on{background:var(--teal);color:#fff}
canvas.pad{width:100%;height:220px;border:1px dashed #9aa7b3;border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.navq{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.qdots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.qdots button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:11px}
.qdots button.done{background:#e8f6ec;border-color:#b7e0c3}.qdots button.now{outline:2px solid var(--teal)}
.stepok{color:var(--ok)}.stepmiss{color:var(--rose)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}th{font-size:12px;color:var(--muted)}
.scorebig{font-size:42px;font-weight:800;color:var(--teal-d)}.hint{font-size:13px;color:var(--muted);line-height:1.5}
.nl{margin:8px 0 4px;overflow-x:auto}footer.note{margin-top:18px;font-size:12px;color:var(--muted)}
.login-hero{text-align:center;margin-bottom:16px}.login-hero h2{margin:6px 0 4px}
</style></head><body>
<div class="wrap">
<div id="sitesBar" class="hidden" style="background:#163a4a;color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
  <span>你而家啲 Google Sites 入面開。內嵌視窗可能儲唔到成績，建議用新分頁作答。</span>
  <button class="btn btn-gold" type="button" onclick="window.open(location.href,'_blank')">新分頁全螢幕開啟</button>
</div>
<header class="app"><div class="brand"><div class="badge">評</div><div>
<h1>簡易不等式教學建議 · 評估卷</h1>
<div class="sub">甲部：最大／最小整數 30 題　·　乙部：一元一次方程 12 題　·　共 42 題／96 分</div>
</div></div><span class="pill" id="whoPill">未登入</span></header>
<section id="loginView" class="card">
<div class="login-hero"><div class="pill">3B 名單已內建　·　個人四位密碼</div>
<h2>學生／教師登入</h2>
<p class="hint">SET：<b>簡易不等式教學建議</b>　·　學生用自己四位密碼　·　教師密碼上一版 <b>246810</b></p></div>
<label>選擇學生（3B1–3B33）</label><select id="stuPick"></select>
<div class="row"><div><label>學生個人密碼</label><input id="stuPin" type="password" inputmode="numeric" maxlength="4" placeholder="例如 2095"/></div>
<div><label>教師密碼（上一版）</label><input id="setPass" type="password" placeholder="246810"/></div></div>
<div class="btn-row"><button class="btn btn-primary" onclick="loginStudent()">學生開始作答</button>
<button class="btn btn-ghost" onclick="loginTeacher()">教師報告室</button>
<button class="btn btn-gold" onclick="demoStudent()">預覽學生卷</button>
<button class="btn btn-ghost" onclick="demoTeacher()">預覽教師室</button></div>
<p class="hint" style="margin-top:14px">打字／手寫 OCR／語音。乙部寫關鍵步驟。報告：未交最先，再由低分到高分。</p>
</section>
<section id="quizView" class="hidden">
<div class="progress"><i id="bar"></i></div><div class="qdots" id="qdots"></div><div class="card" id="qcard"></div>
<div class="navq"><button class="btn btn-ghost" onclick="prevQ()">上一題</button><button class="btn btn-primary" onclick="nextQ()">下一題</button></div>
<div class="btn-row"><button class="btn btn-gold" onclick="reviewAll()">預覽全部作答</button>
<button class="btn btn-primary" onclick="submitPaper()">交卷並即時評分</button>
<button class="btn btn-rose" onclick="logout()">離開</button></div>
</section>
<section id="resultView" class="hidden"><div class="card" id="resultCard"></div>
<div class="btn-row"><button class="btn btn-ghost" onclick="backToQuiz()">返回修改</button>
<button class="btn btn-primary" onclick="downloadMyWord()">下載我的評分報告（Word）</button></div></section>
<section id="teacherView" class="hidden"><div class="card">
<h2 style="margin-top:0">教師報告室 · 由最差排至最好</h2>
<div class="btn-row">
<button class="btn btn-primary" onclick="renderTeacher()">重新整理</button>
<button class="btn btn-gold" onclick="exportTeacherWord()">匯出全班 Word</button>
<button class="btn btn-ghost" onclick="exportJSON()">匯出 JSON</button>
<button class="btn btn-ghost" onclick="document.getElementById('imp').click()">匯入 JSON</button>
<button class="btn btn-rose" onclick="clearAll()">清除本機成績</button>
<input id="imp" type="file" accept="application/json" class="hidden" onchange="importJSON(event)"/>
</div><div id="teacherTable" style="margin-top:14px;overflow:auto"></div></div>
<div class="btn-row"><button class="btn btn-ghost" onclick="logout()">返回登入</button></div></section>
<footer class="note">SET：簡易不等式教學建議　·　教師密碼 246810　·　甲部 30 題　乙部 12 題　滿分 96</footer>
</div>
<script src="quiz_data.js"></script>
<script src="quiz_app.js"></script>
</body></html>
